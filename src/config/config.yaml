server:
  listen: 8080
  workers: 4
  #upstreams:
  #  - id: upstream1
   #   url: http://jsonplaceholder.typicode.com

  #  - id: dummy
   #   url: http://dummyjson.com
  upstreams:
  - id: upstream1
    url: http://localhost:9001

  - id: dummy
    url: http://localhost:9002


  headers:
    - key: X-Forwarded-For
      value: '$ip'

    - key: Authorization
      value: 'Bearer xyz'



  rules:
    - path: /test
      upstreams:
        - dummy
    - path: /
      upstreams:
        - upstream1

    

        